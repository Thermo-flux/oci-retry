name: OCI Auto-Retry Scheduler Debug

on:
  workflow_dispatch:
  schedule:
    - cron: '*/15 * * * *'

jobs:
  debug:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Dump run info
        run: |
          echo "=== Debug run started ==="
          date -u
          echo "EVENT_NAME=$GITHUB_EVENT_NAME"
          echo "REPOSITORY=$GITHUB_REPOSITORY"
          echo "REF=$GITHUB_REF"
          echo "ACTOR=$GITHUB_ACTOR"
          echo "SHA=$GITHUB_SHA"
          echo "RUN_ID=$GITHUB_RUN_ID"
          echo "RUN_NUMBER=$GITHUB_RUN_NUMBER"
          echo "=== ENV END ==="
          mkdir -p output
          echo "event=$GITHUB_EVENT_NAME" > output/debug.txt
          echo "date=$(date -u)" >> output/debug.txt
          echo "repo=$GITHUB_REPOSITORY" >> output/debug.txt

      - name: Upload debug artifact
        uses: actions/upload-artifact@v4
        with:
          name: oci-retry-debug
          path: output/debug.txt
