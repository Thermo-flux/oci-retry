name: OCI Ampere VM Auto-Retry

on:
  workflow_dispatch:
  schedule:
    - cron: '*/15 * * * *'

jobs:
  auto_retry:
    runs-on: [self-hosted, Linux]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install OCI CLI
        run: |
          if command -v oci &> /dev/null; then
            echo "OCI CLI already installed: $(oci --version 2>&1)"
          else
            echo "Installing OCI CLI..."
            pip install oci-cli --quiet --no-warn-script-location || pip3 install oci-cli --quiet --no-warn-script-location
          fi
          echo "$HOME/.local/bin" >> $GITHUB_PATH
          echo "/usr/local/bin" >> $GITHUB_PATH

      - name: Configure OCI CLI Credentials
        env:
          OCI_CLI_USER: ${{ secrets.OCI_CLI_USER }}
          OCI_CLI_TENANCY: ${{ secrets.OCI_CLI_TENANCY }}
          OCI_CLI_FINGERPRINT: ${{ secrets.OCI_CLI_FINGERPRINT }}
          OCI_CLI_KEY_CONTENT: ${{ secrets.OCI_CLI_KEY_CONTENT }}
          OCI_CLI_REGION: ${{ secrets.OCI_CLI_REGION }}
          OCI_CLI_SUPPRESS_FILE_PERMISSIONS_WARNING: "True"
          SUPPRESS_LABEL_WARNING: "True"
        run: |
          mkdir -p ~/.oci
          # Use python3 to reliably write PEM key with correct newlines
          python3 -c "
import os, stat
key = os.environ.get('OCI_CLI_KEY_CONTENT', '')
key = key.strip().strip('\"').strip(\"'\").replace('\\\\n', '\\n').replace('\\n', '\\n')
if not key.endswith('\\n'): key += '\\n'
path = os.path.expanduser('~/.oci/oci_api_key.pem')
open(path, 'w').write(key)
os.chmod(path, 0o600)
print('PEM key written:', len(key), 'bytes')
"
          REGION="${OCI_CLI_REGION:-ap-hyderabad-1}"
          FP="${OCI_CLI_FINGERPRINT}"
          USER_OCID="${OCI_CLI_USER}"
          TENANCY="${OCI_CLI_TENANCY}"
          KEY_FILE="$HOME/.oci/oci_api_key.pem"

          printf '[DEFAULT]\nuser=%s\nfingerprint=%s\nkey_file=%s\ntenancy=%s\nregion=%s\n' \
            "$USER_OCID" "$FP" "$KEY_FILE" "$TENANCY" "$REGION" > ~/.oci/config
          chmod 600 ~/.oci/config

          echo "============================================="
          echo "  OCI Config written successfully"
          echo "  Fingerprint: $FP"
          echo "  Region:      $REGION"
          echo "============================================="
          # Verify PEM is valid
          openssl rsa -in ~/.oci/oci_api_key.pem -check -noout 2>&1 && echo "  PEM key: VALID" || echo "  PEM key: INVALID - check OCI_CLI_KEY_CONTENT secret"

      - name: Execute OCI Resource Manager Apply Job
        env:
          STACK_ID: ${{ secrets.STACK_ID }}
          OCI_CLI_SUPPRESS_FILE_PERMISSIONS_WARNING: "True"
          SUPPRESS_LABEL_WARNING: "True"
        run: |
          STACK_ID="${STACK_ID:-ocid1.ormstack.oc1.ap-hyderabad-1.amaaaaaau77coliauyefjo4yf2ogbtlkpua4gsz5ncpe5fo4mtt2cjeumcna}"
          export PATH="$HOME/.local/bin:/usr/local/bin:$PATH"
          OCI_BIN=$(command -v oci 2>/dev/null || echo "oci")

          echo "================================================"
          echo " Starting OCI Ampere VM Provisioning Trigger"
          echo "================================================"

          attempts=0
          max_attempts=4
          wait_sec=5

          while [ $attempts -lt $max_attempts ]; do
            attempts=$((attempts+1))
            echo "  [*] Attempt $attempts/$max_attempts: Creating OCI Resource Manager Apply Job..."

            JOB_OUTPUT=$($OCI_BIN resource-manager job create-apply-job \
              --stack-id "$STACK_ID" \
              --execution-plan-strategy "AUTO_APPROVED" 2>&1 || true)

            if echo "$JOB_OUTPUT" | grep -q "TooManyRequests"; then
              echo "  [!] Rate limited (HTTP 429). Retrying in ${wait_sec}s..."
              sleep $wait_sec
              wait_sec=$((wait_sec * 2))
              continue
            fi

            JOB_ID=$(echo "$JOB_OUTPUT" | grep -o '"id": *"[^"]*"' | head -1 | sed 's/"id": *"//;s/"//')

            if [ -n "$JOB_ID" ]; then
              echo "================================================"
              echo "  [+] SUCCESS! OCI Job Created!"
              echo "  [+] Job ID: $JOB_ID"
              echo "  [i] Oracle Cloud Resource Manager is provisioning your VM."
              echo "================================================"
              exit 0
            fi

            echo "  [!] OCI API returned an unexpected response:"
            echo "$JOB_OUTPUT"
            exit 1
          done

          echo "  [!] Exceeded max retries. Will retry next scheduled run."
          exit 0
