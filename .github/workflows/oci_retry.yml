name: OCI Ampere VM Auto-Retry

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

jobs:
  auto_retry:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install OCI CLI
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-pip curl jq
          bash -c "$(curl -L https://raw.githubusercontent.com/oracle/oci-cli/master/scripts/install/install.sh)" -- --accept-all-defaults
          echo "/home/runner/bin" >> $GITHUB_PATH

      - name: Configure OCI CLI Credentials
        env:
          OCI_CLI_USER: ${{ secrets.OCI_CLI_USER }}
          OCI_CLI_TENANCY: ${{ secrets.OCI_CLI_TENANCY }}
          OCI_CLI_FINGERPRINT: ${{ secrets.OCI_CLI_FINGERPRINT }}
          OCI_CLI_KEY_CONTENT: ${{ secrets.OCI_CLI_KEY_CONTENT }}
          OCI_CLI_REGION: ${{ secrets.OCI_CLI_REGION }}
          OCI_CLI_SUPPRESS_FILE_PERMISSIONS_WARNING: "True"
          SUPPRESS_LABEL_WARNING: "True"
        run: |
          mkdir -p ~/.oci
          
          # Python script to reconstruct & format PEM key flawlessly regardless of newline stripping
          python3 -c "
import os, re

raw = os.environ.get('OCI_CLI_KEY_CONTENT', '').strip()
header_match = re.search(r'-----BEGIN [^-]+-----', raw)
footer_match = re.search(r'-----END [^-]+-----', raw)

if header_match and footer_match:
    header = header_match.group(0)
    footer = footer_match.group(0)
    body = raw[header_match.end():footer_match.start()].replace(' ', '').replace('\n', '').replace('\r', '')
    wrapped_body = '\n'.join(body[i:i+64] for i in range(0, len(body), 64))
    pem_text = f'{header}\n{wrapped_body}\n{footer}\n'
else:
    pem_text = raw + '\n'

key_path = os.path.expanduser('~/.oci/oci_api_key.pem')
with open(key_path, 'w') as f:
    f.write(pem_text)
"
          chmod 600 ~/.oci/oci_api_key.pem

          # Write OCI config file
          cat << EOF > ~/.oci/config
          [DEFAULT]
          user=${OCI_CLI_USER}
          fingerprint=${OCI_CLI_FINGERPRINT}
          key_file=/home/runner/.oci/oci_api_key.pem
          tenancy=${OCI_CLI_TENANCY}
          region=${OCI_CLI_REGION:-ap-hyderabad-1}
          EOF
          
          chmod 600 ~/.oci/config

      - name: Execute OCI Resource Manager Apply Job
        env:
          STACK_ID: ${{ secrets.STACK_ID }}
          OCI_CLI_SUPPRESS_FILE_PERMISSIONS_WARNING: "True"
          SUPPRESS_LABEL_WARNING: "True"
        run: |
          STACK_ID="${STACK_ID:-ocid1.ormstack.oc1.ap-hyderabad-1.amaaaaaau77coliauyefjo4yf2ogbtlkpua4gsz5ncpe5fo4mtt2cjeumcna}"
          
          echo "==============================================="
          echo " Starting OCI Ampere VM Provisioning Retry"
          echo "==============================================="
          
          # Create apply job and capture output
          JOB_OUTPUT=$(/home/runner/bin/oci resource-manager job create-apply-job \
            --stack-id "$STACK_ID" \
            --execution-plan-strategy "AUTO_APPROVED" 2>&1 || true)
          
          JOB_ID=$(echo "$JOB_OUTPUT" | jq -r '.data.id // empty' 2>/dev/null || echo "")

          if [ -z "$JOB_ID" ]; then
            if [[ "$JOB_OUTPUT" == *"TooManyRequests"* ]]; then
              echo "  [!] Oracle API Rate Limit reached (HTTP 429: TooManyRequests)."
              echo "  [i] The rate limit window will reset before the next scheduled run in 15 minutes."
              exit 0
            fi
            echo "  [!] Failed to trigger job. OCI response output:"
            echo "$JOB_OUTPUT"
            exit 1
          fi

          echo "  [+] Job created (ID: $JOB_ID). Monitoring status..."

          while true; do
            sleep 15
            JOB_STATE=$(/home/runner/bin/oci resource-manager job get --job-id "$JOB_ID" --query 'data."lifecycle-state"' --raw-output 2>/dev/null || echo "UNKNOWN")

            case "$JOB_STATE" in
              "SUCCEEDED")
                echo ""
                echo "==============================================="
                echo " SUCCESS! Your Ampere VM has been provisioned!"
                echo "==============================================="
                exit 0
                ;;
              "FAILED"|"CANCELED")
                echo "  [-] Job ended with status: $JOB_STATE (Out of capacity)."
                exit 0
                ;;
              "IN_PROGRESS"|"ACCEPTED")
                echo "  [...] Job still running ($JOB_STATE). Waiting..."
                ;;
              *)
                echo "  [?] Status: '$JOB_STATE'. Checking again..."
                ;;
            esac
          done
