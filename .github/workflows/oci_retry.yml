name: OCI Ampere VM Auto-Retry

on:
  workflow_dispatch:
  schedule:
    - cron: '*/5 * * * *'

jobs:
  auto_retry:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install OCI CLI
        run: |
          if ! command -v oci &> /dev/null; then
            pip install oci-cli --quiet --no-warn-script-location
          fi
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Configure OCI CLI Credentials
        env:
          OCI_CLI_USER: ${{ secrets.OCI_CLI_USER }}
          OCI_CLI_TENANCY: ${{ secrets.OCI_CLI_TENANCY }}
          OCI_CLI_FINGERPRINT: ${{ secrets.OCI_CLI_FINGERPRINT }}
          OCI_CLI_KEY_CONTENT: ${{ secrets.OCI_CLI_KEY_CONTENT }}
          OCI_CLI_REGION: ${{ secrets.OCI_CLI_REGION }}
          OCI_CLI_SUPPRESS_FILE_PERMISSIONS_WARNING: "True"
          SUPPRESS_LABEL_WARNING: "True"
        run: python3 scripts/setup_oci.py

      - name: Execute OCI Resource Manager Apply Job
        env:
          STACK_ID: ${{ secrets.STACK_ID }}
          OCI_CLI_SUPPRESS_FILE_PERMISSIONS_WARNING: "True"
          SUPPRESS_LABEL_WARNING: "True"
        run: |
          STACK_ID="${STACK_ID:-ocid1.ormstack.oc1.ap-hyderabad-1.amaaaaaau77coliauyefjo4yf2ogbtlkpua4gsz5ncpe5fo4mtt2cjeumcna}"
          export PATH="$HOME/.local/bin:$PATH"
          
          echo "================================================"
          echo " Starting OCI Ampere VM Provisioning Trigger"
          echo "================================================"

          echo "  [*] Attempting OCI Resource Manager Apply Job..."

          JOB_OUTPUT=$(oci resource-manager job create-apply-job \
            --stack-id "$STACK_ID" \
            --execution-plan-strategy "AUTO_APPROVED" 2>&1 || true)

          JOB_ID=$(echo "$JOB_OUTPUT" | grep -o '"id": *"[^"]*"' | head -1 | sed 's/"id": *"//;s/"//')

          if [ -n "$JOB_ID" ]; then
            echo "================================================"
            echo "  [+] SUCCESS! OCI Job Created!"
            echo "  [+] Job ID: $JOB_ID"
            echo "  [i] Oracle Cloud Resource Manager is provisioning your VM."
            echo "================================================"
            exit 0
          fi

          if echo "$JOB_OUTPUT" | grep -q "TooManyRequests"; then
            echo "  [!] Rate limited by OCI API (HTTP 429). Will retry on next 5-min scheduled run."
            exit 0
          fi

          echo "  [!] OCI API Response:"
          echo "$JOB_OUTPUT"
