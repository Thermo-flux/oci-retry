name: OCI Ampere VM Auto-Retry

on:
  workflow_dispatch:
  schedule:
    - cron: '*/15 * * * *'

jobs:
  auto_retry:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install OCI CLI
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-pip curl jq
          bash -c "$(curl -L https://raw.githubusercontent.com/oracle/oci-cli/master/scripts/install/install.sh)" -- --accept-all-defaults
          echo "/home/runner/bin" >> $GITHUB_PATH

      - name: Configure OCI CLI Credentials
        env:
          OCI_CLI_USER: ${{ secrets.OCI_CLI_USER }}
          OCI_CLI_TENANCY: ${{ secrets.OCI_CLI_TENANCY }}
          OCI_CLI_FINGERPRINT: ${{ secrets.OCI_CLI_FINGERPRINT }}
          OCI_CLI_KEY_CONTENT: ${{ secrets.OCI_CLI_KEY_CONTENT }}
          OCI_CLI_REGION: ${{ secrets.OCI_CLI_REGION }}
          OCI_CLI_SUPPRESS_FILE_PERMISSIONS_WARNING: "True"
          SUPPRESS_LABEL_WARNING: "True"
        run: |
          mkdir -p ~/.oci
          python3 - << 'PY'
          import os, subprocess, hashlib

          key_path = os.path.expanduser('~/.oci/oci_api_key.pem')
          raw_key = os.environ.get('OCI_CLI_KEY_CONTENT', '').strip().strip('"').strip("'").replace('\\\\n', '\n').replace('\\n', '\n')
          if not raw_key.endswith('\n'):
              raw_key += '\n'

          with open(key_path, 'w') as f:
              f.write(raw_key)
          os.chmod(key_path, 0o600)

          calc_fp = ""
          try:
              res = subprocess.run(['openssl', 'rsa', '-in', key_path, '-pubout', '-outform', 'DER'], capture_output=True, check=True)
              md5_hex = hashlib.md5(res.stdout).hexdigest()
              calc_fp = ':'.join(md5_hex[i:i+2] for i in range(0, len(md5_hex), 2))
          except Exception as e:
              print(f"Fingerprint calculation error: {e}")

          secret_fp = os.environ.get('OCI_CLI_FINGERPRINT', '').strip().strip('"').strip("'").lower()
          final_fp = calc_fp if calc_fp else secret_fp

          user = os.environ.get('OCI_CLI_USER', '').strip().strip('"').strip("'")
          tenancy = os.environ.get('OCI_CLI_TENANCY', '').strip().strip('"').strip("'")
          region = os.environ.get('OCI_CLI_REGION', 'ap-hyderabad-1').strip().strip('"').strip("'") or 'ap-hyderabad-1'

          config_path = os.path.expanduser('~/.oci/config')
          config_content = f"""[DEFAULT]
          user={user}
          fingerprint={final_fp}
          key_file={key_path}
          tenancy={tenancy}
          region={region}
          """

          with open(config_path, 'w') as f:
              f.write(config_content)
          os.chmod(config_path, 0o600)

          print("===============================================")
          print(" OCI Credential Verification Summary")
          print("===============================================")
          print(f"  [*] Secret Fingerprint:     {secret_fp}")
          print(f"  [*] Derived Key Fingerprint: {calc_fp}")
          print(f"  [*] Active Fingerprint Used: {final_fp}")
          print(f"  [*] User OCID:              {user[:15]}...{user[-6:] if len(user)>20 else user}")
          print(f"  [*] Tenancy OCID:           {tenancy[:15]}...{tenancy[-6:] if len(tenancy)>20 else tenancy}")
          print(f"  [*] Region:                 {region}")
          print("===============================================")
          PY

      - name: Execute OCI Resource Manager Apply Job
        env:
          STACK_ID: ${{ secrets.STACK_ID }}
          OCI_CLI_SUPPRESS_FILE_PERMISSIONS_WARNING: "True"
          SUPPRESS_LABEL_WARNING: "True"
        run: |
          STACK_ID="${STACK_ID:-ocid1.ormstack.oc1.ap-hyderabad-1.amaaaaaau77coliauyefjo4yf2ogbtlkpua4gsz5ncpe5fo4mtt2cjeumcna}"
          
          echo "==============================================="
          echo " Starting OCI Ampere VM Provisioning Trigger"
          echo "==============================================="
          
          attempts=0
          max_attempts=4
          wait_sec=5

          while [ $attempts -lt $max_attempts ]; do
            attempts=$((attempts+1))
            echo "  [*] Attempt $attempts/$max_attempts: Creating OCI Resource Manager Apply Job..."

            JOB_OUTPUT=$(/home/runner/bin/oci resource-manager job create-apply-job \
              --stack-id "$STACK_ID" \
              --execution-plan-strategy "AUTO_APPROVED" 2>&1 || true)

            if echo "$JOB_OUTPUT" | grep -q "TooManyRequests"; then
              echo "  [!] Rate limited by OCI API (HTTP 429). Retrying in ${wait_sec}s..."
              sleep $wait_sec
              wait_sec=$((wait_sec * 2))
              continue
            fi

            JOB_ID=$(echo "$JOB_OUTPUT" | jq -r '.data.id // empty' 2>/dev/null || echo "")

            if [ -n "$JOB_ID" ]; then
              echo ""
              echo "==============================================="
              echo "  [+] SUCCESS! OCI Job Created!"
              echo "  [+] Job ID: $JOB_ID"
              echo "  [i] Oracle Cloud Resource Manager is processing your VM creation asynchronously in the background."
              echo "==============================================="
              exit 0
            fi

            echo "  [!] OCI API returned an unexpected response:"
            echo "$JOB_OUTPUT"
            exit 1
          done

          echo "  [!] Exceeded max retries due to rate limiting (HTTP 429). Will try again next scheduled run."
          exit 0

