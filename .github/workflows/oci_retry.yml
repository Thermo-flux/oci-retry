name: OCI Ampere VM Auto-Retry

on:
  workflow_dispatch:
  schedule:
    - cron: '*/15 * * * *'

jobs:
  auto_retry:
    runs-on: [self-hosted, Linux]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Trigger OCI Resource Manager Apply Job
        env:
          OCI_CLI_USER: ${{ secrets.OCI_CLI_USER }}
          OCI_CLI_TENANCY: ${{ secrets.OCI_CLI_TENANCY }}
          OCI_CLI_FINGERPRINT: ${{ secrets.OCI_CLI_FINGERPRINT }}
          OCI_CLI_KEY_CONTENT: ${{ secrets.OCI_CLI_KEY_CONTENT }}
          OCI_CLI_REGION: ${{ secrets.OCI_CLI_REGION }}
          STACK_ID: ${{ secrets.STACK_ID }}
        run: |
          python3 - << 'PYEOF'
          import os, sys, json, hashlib, base64, datetime, urllib.request, urllib.error

          # ── Load secrets ──────────────────────────────────────────────────────────
          def clean(v):
              return v.strip().strip('"').strip("'") if v else ''

          user      = clean(os.environ.get('OCI_CLI_USER', ''))
          tenancy   = clean(os.environ.get('OCI_CLI_TENANCY', ''))
          fingerprint = clean(os.environ.get('OCI_CLI_FINGERPRINT', '')).lower()
          region    = clean(os.environ.get('OCI_CLI_REGION', '')) or 'ap-hyderabad-1'
          stack_id  = clean(os.environ.get('STACK_ID', '')) or \
                      'ocid1.ormstack.oc1.ap-hyderabad-1.amaaaaaau77coliauyefjo4yf2ogbtlkpua4gsz5ncpe5fo4mtt2cjeumcna'

          raw_key = os.environ.get('OCI_CLI_KEY_CONTENT', '') \
                      .strip().strip('"').strip("'") \
                      .replace('\\n', '\n').replace('\\\\n', '\n')
          if not raw_key.endswith('\n'):
              raw_key += '\n'

          # Write key to temp file for openssl signing
          import tempfile, subprocess
          key_file = tempfile.NamedTemporaryFile(delete=False, suffix='.pem', mode='w')
          key_file.write(raw_key)
          key_file.close()
          os.chmod(key_file.name, 0o600)

          print("=" * 55)
          print("  OCI Ampere VM Provisioning Trigger")
          print("=" * 55)
          print(f"  [*] Region:      {region}")
          print(f"  [*] Fingerprint: {fingerprint}")
          print(f"  [*] Stack ID:    {stack_id[:40]}...")
          print("=" * 55)

          # ── OCI HTTP Signature helper ─────────────────────────────────────────────
          def sign_request(method, host, path, body_bytes, key_path, fp, user_ocid, tenancy_ocid):
              date_str = datetime.datetime.utcnow().strftime('%a, %d %b %Y %H:%M:%S GMT')
              body_hash = base64.b64encode(hashlib.sha256(body_bytes).digest()).decode()
              content_len = str(len(body_bytes))

              # Header order MUST match the headers= list exactly
              headers_to_sign = ['(request-target)', 'date', 'host', 'content-length', 'content-type', 'x-content-sha256']
              signing_str = '\n'.join([
                  f'(request-target): {method.lower()} {path}',
                  f'date: {date_str}',
                  f'host: {host}',
                  f'content-length: {content_len}',
                  f'content-type: application/json',
                  f'x-content-sha256: {body_hash}',
              ])

              # Sign with openssl
              import tempfile as tf
              sig_in = tf.NamedTemporaryFile(delete=False, mode='w')
              sig_in.write(signing_str)
              sig_in.close()

              result = subprocess.run(
                  ['openssl', 'dgst', '-sha256', '-sign', key_path, '-out', sig_in.name + '.sig', sig_in.name],
                  capture_output=True
              )
              if result.returncode != 0:
                  print(f"  [!] openssl sign error: {result.stderr.decode()}")
                  sys.exit(1)

              with open(sig_in.name + '.sig', 'rb') as f:
                  signature = base64.b64encode(f.read()).decode()

              os.unlink(sig_in.name)
              os.unlink(sig_in.name + '.sig')

              # keyId MUST be tenancy/user/fingerprint (this exact order)
              auth_header = (
                  f'Signature version="1",'
                  f'headers="{" ".join(headers_to_sign)}",'
                  f'keyId="{tenancy_ocid}/{user_ocid}/{fp}",'
                  f'algorithm="rsa-sha256",'
                  f'signature="{signature}"'
              )

              return {
                  'date': date_str,
                  'host': host,
                  'content-type': 'application/json',
                  'content-length': content_len,
                  'x-content-sha256': body_hash,
                  'authorization': auth_header,
              }

          # ── Make the API call ─────────────────────────────────────────────────────
          host = f'resourcemanager.{region}.oci.oraclecloud.com'
          path = '/20180917/jobs'
          body = json.dumps({
              'stackId': stack_id,
              'jobOperationDetails': {
                  'operation': 'APPLY',
                  'executionPlanStrategy': 'AUTO_APPROVED'
              }
          }).encode()

          max_attempts = 4
          wait_sec = 5

          for attempt in range(1, max_attempts + 1):
              print(f"\n  [*] Attempt {attempt}/{max_attempts}: Calling OCI Resource Manager API...")

              try:
                  headers = sign_request('POST', host, path, body, key_file.name, fingerprint, user, tenancy)
                  req = urllib.request.Request(
                      f'https://{host}{path}',
                      data=body,
                      headers=headers,
                      method='POST'
                  )
                  with urllib.request.urlopen(req, timeout=30) as resp:
                      resp_body = json.loads(resp.read().decode())
                      job_id = resp_body.get('data', {}).get('id', '')
                      if job_id:
                          print(f"\n  [+] SUCCESS! OCI Job Created!")
                          print(f"  [+] Job ID: {job_id}")
                          print(f"  [i] Oracle Cloud Resource Manager is provisioning your VM in the background.")
                          print("=" * 55)
                          sys.exit(0)

              except urllib.error.HTTPError as e:
                  body_err = e.read().decode()
                  if 'TooManyRequests' in body_err or e.code == 429:
                      print(f"  [!] Rate limited (HTTP 429). Retrying in {wait_sec}s...")
                      import time; time.sleep(wait_sec)
                      wait_sec *= 2
                      continue
                  elif e.code == 409:
                      print(f"  [!] Conflict (HTTP 409) — a job may already be running. Treating as success.")
                      print(f"  [i] Response: {body_err[:300]}")
                      sys.exit(0)
                  else:
                      print(f"  [!] HTTP Error {e.code}: {body_err[:500]}")
                      sys.exit(1)
              except Exception as ex:
                  print(f"  [!] Unexpected error: {ex}")
                  sys.exit(1)

          print("  [!] Exceeded max retries. Will retry next scheduled run.")
          sys.exit(0)
          PYEOF
