name: OCI ARM Host Capacity (Hitrov)

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */6 * * *'

jobs:
  run-hitrov:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          tools: composer

      - name: Clone hitrov/oci-arm-host-capacity
        run: |
          git clone https://github.com/hitrov/oci-arm-host-capacity.git hitrov-app
          cd hitrov-app
          composer install --no-dev --quiet

      - name: Configure Credentials
        env:
          OCI_CLI_USER: ${{ secrets.OCI_CLI_USER }}
          OCI_CLI_TENANCY: ${{ secrets.OCI_CLI_TENANCY }}
          OCI_CLI_FINGERPRINT: ${{ secrets.OCI_CLI_FINGERPRINT }}
          OCI_CLI_KEY_CONTENT: ${{ secrets.OCI_CLI_KEY_CONTENT }}
          OCI_CLI_REGION: ${{ secrets.OCI_CLI_REGION }}
          STACK_ID: ${{ secrets.STACK_ID }}
        run: python3 scripts/setup_oci.py

      - name: Run Hitrov Script Continuous Loop (72 Retries over 6 Hours)
        env:
          OCI_CLI_USER: ${{ secrets.OCI_CLI_USER }}
          OCI_CLI_TENANCY: ${{ secrets.OCI_CLI_TENANCY }}
          OCI_CLI_FINGERPRINT: ${{ secrets.OCI_CLI_FINGERPRINT }}
          OCI_CLI_REGION: ${{ secrets.OCI_CLI_REGION }}
          OCI_SUBNET_ID: ${{ secrets.OCI_SUBNET_ID }}
          OCI_IMAGE_ID: ${{ secrets.OCI_IMAGE_ID }}
          OCI_SSH_PUBLIC_KEY: ${{ secrets.OCI_SSH_PUBLIC_KEY }}
        run: |
          cd hitrov-app

          cat > .env << EOF
          OCI_REGION="${OCI_CLI_REGION:-ap-hyderabad-1}"
          OCI_USER_ID="${OCI_CLI_USER}"
          OCI_TENANCY_ID="${OCI_CLI_TENANCY}"
          OCI_KEY_FINGERPRINT="${OCI_CLI_FINGERPRINT}"
          OCI_PRIVATE_KEY_FILENAME="${HOME}/.oci/oci_api_key.pem"
          OCI_SUBNET_ID="${OCI_SUBNET_ID}"
          OCI_IMAGE_ID="${OCI_IMAGE_ID}"
          OCI_SSH_PUBLIC_KEY="${OCI_SSH_PUBLIC_KEY}"
          OCI_OCPUS=2
          OCI_MEMORY_IN_GBS=12
          OCI_SHAPE="VM.Standard.A1.Flex"
          OCI_MAX_INSTANCES=1
          EOF

          echo "================================================"
          echo " Starting Continuous 6-Hour Loop (Retrying every 5 min)"
          echo " (Requesting 2 OCPUs / 12 GB RAM in Hyderabad)"
          echo "================================================"

          for i in {1..72}; do
            echo ""
            echo "--- Attempt $i of 72 [$(date -u +'%Y-%m-%d %H:%M:%S UTC')] ---"
            
            output=$(php index.php 2>&1)
            echo "$output"

            # If instance was successfully created or already exists, stop the loop cleanly
            if echo "$output" | grep -iq "Instance created\|Instance already exists"; then
              echo "🎉 SUCCESS: Instance created or already exists! Stopping loop."
              exit 0
            fi

            echo "Sleeping 5 minutes before next attempt..."
            sleep 300
          done
